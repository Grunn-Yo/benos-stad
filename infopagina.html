<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beno's Stad - Info</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <div id="content"></div>
  </main>

  <script>
     
    // URL-parameters uitlezen
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const title = params.get("title"); // Titel uit de marker

    const container = document.getElementById("content");

    if (id) {
  // Pad naar het tekstbestand per pagina
  const filePath = `paginas/${id}.txt`;

  fetch(filePath)
    .then(response => {
      if (!response.ok) throw new Error("Pagina niet gevonden");
      return response.text();
    })
    .then(html => {
      container.innerHTML = title ? `<h1>${title}</h1>` + html : html;
    })
    .catch(err => {
      container.innerHTML = `<p>Geen informatie gevonden voor dit item.</p>`;
      console.error(err);
    });
    } else {
      container.innerHTML = `<p>Geen informatie gevonden voor dit item.</p>`;
    }
  </script>
</body>
</html>
