<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beno's Stad - Info</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <div id="content"></div>
  </main>

  <script src="paginaData.js"></script>

  <script>
     
    // URL-parameters uitlezen    
    const params = new URLSearchParams(window.location.search);
    const aflJSON = params.get("afl");
    const id = params.get("id");
    const title = params.get("title");
    let afl = JSON.parse(decodeURIComponent(aflJSON));
    const container = document.getElementById("content");

    if (id) {
    // Pad naar het tekstbestand per pagina
      const filePath = `paginas/${afl[0]}_${id}.txt`;

      fetch(filePath)
        .then(response => {
        if (!response.ok) throw new Error("Pagina niet gevonden");
          return response.text();
        })
        .then(html => {
        //  Links genereren voor alle afleveringen
const linksHTML = afl.map(nr => {
  const data = afleveringenData[nr];
  if (!data) return "";

  return `
    <p>
      Zie <a href="${data.url}" target="_blank">
        Beno's Stad ${nr}: ${data.titel}
      </a>.
      <br>
      <a href="transcript.html?nr=${nr}">
        Lees het transcript van aflevering ${nr}
      </a>
    </p>
  `;
}).join("");

      container.innerHTML = `
        ${title ? `<h1>${title}</h1>` : ""}

        <div class="page-content">
          ${html}
        </div>

        <div class="bottom-bar">
            <hr>
            ${linksHTML}
          </div>
        `;
    })
    .catch(err => {
      container.innerHTML = `<p>Geen informatie gevonden voor dit item.</p>`;
      console.error(err);
    });
    } else {
      container.innerHTML = `<p>Geen informatie gevonden voor dit item.</p>`;
    }
  </script>
</body>
</html>
