<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beno's Stad - Info</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <div id="content"></div>
  </main>

  <script src="paginaData.js"></script>

  <script>
     
    // URL-parameters uitlezen    
    const params = new URLSearchParams(window.location.search);
    const aflJSON = params.get("afl");
    const id = params.get("id");
    const title = params.get("title");
    let afl = JSON.parse(decodeURIComponent(aflJSON));
    const container = document.getElementById("content");

    if (id) {
    // Pad naar het tekstbestand per pagina
      const filePath = `paginas/${afl[0]}_${id}.txt`;

      fetch(filePath)
        .then(response => {
        if (!response.ok) throw new Error("Pagina niet gevonden");
          return response.text();
        })
        .then(html => {
  // Links genereren voor alle afleveringen
        const linkPromises = afl.map(nr => {
          const data = afleveringenData[nr];
          if (!data) return Promise.resolve("");

          // Controleer of het transcript bestaat
          const transcriptPath = `transcript/aflevering${nr}.txt`;

          return fetch(transcriptPath)
            .then(response => {
              let transcriptLink = "";

              if (response.ok) {
                transcriptLink = `
                  <br>
                  Zie <a href="transcriptpagina.html?nr=${nr}">
                    hier
                  </a> het transcript van aflevering ${nr}.
                `;
              }

              return `
                <p>
                  Zie <a href="${data.url}" target="_blank">
                    Beno's Stad ${nr}: ${data.titel}</a>.
                  ${transcriptLink}
                </p>
              `;
            })
            .catch(() => {
              // Geen transcriptbestand: alleen de gewone afleveringlink tonen
              return `
                <p>
                  Zie <a href="${data.url}" target="_blank">
                    Beno's Stad ${nr}: ${data.titel}</a>.
                </p>
              `;
            });
        });

        Promise.all(linkPromises).then(results => {
          const linksHTML = results.join("");

          container.innerHTML = `
            ${title ? `<h1>${title}</h1>` : ""}

            <div class="page-content">
              ${html}
            </div>

            <div class="bottom-bar">
              <hr>
              ${linksHTML}
            </div>
          `;
        });
  </script>
</body>
</html>
