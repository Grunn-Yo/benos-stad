<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beno's Stad kaart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
  <main>
    <h1> Beno's Stad op de kaart</h1>
    <div id="map" style="width: 1000px; height: 650px; max-width: 100%;"></div>
    <div>
      <label for="episodeNumber">Zoek aflevering:</label>
      <input type="number" id="episodeNumber" onkeydown="checkEnter(event)">
      <button onclick="filterMarkers()">Zoek</button>
      <button onclick="resetMarkers()">Reset</button>
    </div>
    <label for="statusFilter">Status:</label>
    <select id="statusFilter">
      <option value="all">Alle</option>
      <option value="finished">Alleen met infopagina</option>
      <option value="unfinished">Alleen zonder infopagina</option>
    </select>
  </main>

  <script>

    var originalCenter = [53.219384324385025, 6.568212652979871];
    var originalZoom = 13;

    var map = L.map('map', {
      center: originalCenter,
      zoom: originalZoom
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var purpleIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-violet.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    var blueIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    var markers = [];

    function addMarker(afleveringen, id, lat, lng, extraText, isAf) {
      // Zorg dat afleveringen altijd een array is
      if (!Array.isArray(afleveringen)) afleveringen = [afleveringen];

      var tooltipText = "Beno's Stad " + afleveringen.join(", ");
      if (extraText) tooltipText += " <br/> " + extraText;

      var iconToUse = isAf ? purpleIcon : blueIcon;
      var marker = L.marker([lat, lng], {
        icon: iconToUse
      }).addTo(map);
      marker.bindTooltip(tooltipText, { permanent: false });

      marker.isAf = isAf; // true of false

      // Koppel alle afleveringen aan deze marker
      marker.afleveringen = afleveringen;

      
      //Verander afleveringen in een string voor de URL 
      let afleveringenJSON = JSON.stringify(afleveringen);
      let afleveringenParam = encodeURIComponent(afleveringenJSON);

      marker.on('click', function() {
        window.open(
          'infopagina.html?afl=' + afleveringenParam + '&id=' + id + "&title=" + encodeURIComponent(extraText),
          '_blank'
        );
      });



      markers.push(marker);
    }
    
    </script>

    <script src="markers.js"></script>

    <script>
    function filterMarkers() {
      var episodeNumber = parseFloat(document.getElementById('episodeNumber').value);
      var statusFilter = document.getElementById('statusFilter').value;

      var visibleMarkers = [];

      markers.forEach(function(marker) {
        // Aflevering check
        var episodeMatch = isNaN(episodeNumber) || marker.afleveringen.includes(episodeNumber);

        // Status check
        var statusMatch = true;
        if (statusFilter === "finished") {
          statusMatch = marker.isAf === true;
        } 
        else if (statusFilter === "unfinished") {
          statusMatch = marker.isAf === false;
        }

        if (episodeMatch && statusMatch) {
          marker.addTo(map);
          visibleMarkers.push(marker);
        } else {
          map.removeLayer(marker);
        }
      });

      if (visibleMarkers.length > 0) {
        var group = new L.featureGroup(visibleMarkers);
        map.flyToBounds(group.getBounds(), {
          padding: [50, 50],
          duration: 0.7
        });
      }
    }
    
    function checkEnter(event) {
      if (event.key === 'Enter') {
        filterMarkers();
      }
    }

    document.getElementById('statusFilter').addEventListener('change', function() {
       filterMarkers();
    });

    function resetMarkers() {
      markers.forEach(function(marker) {
        marker.addTo(map);
      });
      document.getElementById('episodeNumber').value = "";

      // Terug naar originele positie
      map.flyTo(originalCenter, originalZoom, {
        duration: 0.7
      });
    }

  </script>
</body>
</html>
