<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenStreetMap Beno's Stad</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
  <main>
    <h1> Beno's Stad op de kaart</h1>
    <div id="map" style="width: 1000px; height: 650px; max-width: 100%;"></div>
    <div>
      <label for="episodeNumber">Zoek aflevering:</label>
      <input type="number" id="episodeNumber" onkeydown="checkEnter(event)">
      <button onclick="filterMarkers()">Zoek</button>
      <button onclick="resetMarkers()">Reset</button>
    </div>
  </main>

  <script>

    var originalCenter = [53.219384324385025, 6.568212652979871];
    var originalZoom = 13;

    var map = L.map('map', {
      center: originalCenter,
      zoom: originalZoom
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var markers = [];

    function addMarker(afleveringen, id, lat, lng, extraText) {
      // Zorg dat afleveringen altijd een array is
      if (!Array.isArray(afleveringen)) afleveringen = [afleveringen];

      var tooltipText = "Beno's Stad " + afleveringen.join(", ");
      if (extraText) tooltipText += " <br/> " + extraText;

      var linkId = afleveringen.join("_") + "_" + id;
      var marker = L.marker([lat, lng]).addTo(map);
      marker.bindTooltip(tooltipText, { permanent: false });

      // Koppel alle afleveringen aan deze marker
      marker.afleveringen = afleveringen;

      marker.on('click', function() {
        window.open(
          'infopagina.html?id=' + linkId + "&title=" + encodeURIComponent(extraText),
          '_blank'
        );
      });

      markers.push(marker);
    }
    
    </script>

    <script src="markers.js"></script>

    <script>
    function filterMarkers() {
      var episodeNumber = parseFloat(document.getElementById('episodeNumber').value);
      
      if (isNaN(episodeNumber)) {
        resetMarkers();
        return;
      }

      var visibleMarkers = [];

      markers.forEach(function(marker) {
        var match = marker.afleveringen.includes(episodeNumber);

        if (match) {
          marker.addTo(map);
          visibleMarkers.push(marker);
        } else {
          map.removeLayer(marker);
        }
      });

      if (visibleMarkers.length > 0) {
        var group = new L.featureGroup(visibleMarkers);
        map.flyToBounds(group.getBounds(), {
          padding: [50, 50],
          duration: 0.7
        });
      }
    }
    
    function checkEnter(event) {
      if (event.key === 'Enter') {
        filterMarkers();
      }
    }

    function resetMarkers() {
      markers.forEach(function(marker) {
        marker.addTo(map);
      });
      document.getElementById('episodeNumber').value = "";

      // Terug naar originele positie
      map.flyTo(originalCenter, originalZoom, {
        duration: 0.7
      });
    }

  </script>
</body>
</html>
